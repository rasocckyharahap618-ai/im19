name: IM 19 RAG CI

on:
  push:
    branches: [main]
    paths:
      - "integrations/rag/**"
      - "scripts/rag_preflight.py"
      - "tests/**"
      - ".github/workflows/rag-ci.yml"
  pull_request:
    paths:
      - "integrations/rag/**"
      - "scripts/rag_preflight.py"
      - "tests/**"
      - ".github/workflows/rag-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: im19-rag-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline checks (no production credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: integrations/rag/requirements.txt

      - name: Install RAG dependencies
        run: python -m pip install -r integrations/rag/requirements.txt

      - name: Compile RAG, tests, and scripts
        run: python -m compileall -q integrations/rag tests scripts

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Run offline workspace preflight
        run: python scripts/rag_preflight.py

      - name: Verify workflow does not require live credentials
        run: |
          python - <<'PY'
          import os
          forbidden = ("DROPBOX_ACCESS_TOKEN", "SUPABASE_SERVICE_ROLE_KEY")
          present = [name for name in forbidden if os.environ.get(name)]
          if present:
              raise SystemExit("CI must not receive production credentials: " + ", ".join(present))
          print("OK: no production Dropbox/Supabase credentials supplied to this job.")
          PY
