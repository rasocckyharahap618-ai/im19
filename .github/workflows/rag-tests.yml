name: Institutional RAG tests

on:
  pull_request:
    paths:
      - "integrations/rag/**"
      - ".github/workflows/rag-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "integrations/rag/**"
      - ".github/workflows/rag-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: integrations/rag/requirements.txt
      - name: Install RAG dependencies
        run: python -m pip install -r integrations/rag/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q integrations/rag
      - name: Run credential-free unit tests
        run: python -m unittest discover -s integrations/rag/tests -v
