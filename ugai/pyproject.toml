[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ugai-agent"
version = "0.4.0"
description = "Evidence-first, resumable agent orchestration runtime"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "PyYAML>=6.0"]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.35"]
observability = ["opentelemetry-api>=1.25", "prometheus-client>=0.20"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "jsonschema>=4.22"]

[project.scripts]
ugai = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "api*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
